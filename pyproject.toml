[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcr-proxy"
version = "0.1.0"
description = "Tape Deck: a local HTTP/HTTPS record-and-replay proxy for integration tests."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "cryptography",
  "h11",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
  "trustme",
]
dev = [
  "pytest==9.0.2",
  "trustme",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
]

[project.scripts]
vcr-proxy = "vcr_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["vcr_proxy*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP006", "UP017", "UP035", "UP045"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
